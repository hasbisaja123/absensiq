
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absensi QR Sekolah</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #111;
    }
    header {
      height: 58px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      background: #111;
      color: white;
      border-bottom: 1px solid #444;
      font-weight: bold;
      letter-spacing: 1px;
    }
    iframe {
      display: block;
      width: 100%;
      height: calc(100% - 58px);
      border: 0;
      background: white;
    }
    .warning {
      padding: 10px;
      color: white;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>ABSENSI QR</header>

  <iframe
    src="GANTI_DENGAN_URL_WEB_APP_APPS_SCRIPT"
    title="Aplikasi Absensi QR"
    allow="camera; fullscreen"
    allowfullscreen>
  </iframe>

  <noscript>
    <p class="warning">Aktifkan JavaScript untuk menggunakan aplikasi.</p>
  </noscript>
</body>
</html>
