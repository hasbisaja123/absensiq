<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AbsensiQR | Absensi Siswa</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

</head>

<body>
  <main class="app">
    <div class="logo">▦</div>

    <h1>AbsensiQR</h1>
    <p class="subtitle">
      Sistem Absensi Siswa Berbasis QR Code
    </p>

    <label class="label" for="nama">
      Nama siswa (opsional)
    </label>
    <input
      id="nama"
      type="text"
      placeholder="Masukkan nama siswa"
      autocomplete="name"
    >

    <div class="camera-box">
      <h3>Scan QR Code</h3>
      <p>Arahkan kamera ke QR Code siswa.</p>

      <div id="reader"></div>

      <button id="startBtn" type="button">
        BUKA KAMERA
      </button>

      <button
        id="stopBtn"
        class="secondary"
        type="button"
      >
        TUTUP KAMERA
      </button>
    </div>

    <p id="status" role="status" aria-live="polite">
      Kamera belum dibuka.
    </p>

    <div id="result" aria-live="polite">
      <strong>QR berhasil dibaca</strong>
      <p id="qrOutput"></p>
      <p id="timeOutput"></p>
    </div>

    <p class="footer">
      AbsensiQR · Sistem Hitam Putih
    </p>
  </main>

  <script>
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusBox = document.getElementById("status");
    const resultBox = document.getElementById("result");
    const qrOutput = document.getElementById("qrOutput");
    const timeOutput = document.getElementById("timeOutput");

    let scanner = null;
    let running = false;
    let busy = false;
    let lastCode = "";
    let lastScanTime = 0;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    async function openCamera() {
      if (busy || running) return;

      if (!window.isSecureContext) {
        setStatus("Buka website melalui HTTPS agar kamera bisa digunakan.");
        return;
      }

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        setStatus("Browser ini tidak mendukung akses kamera.");
        return;
      }

      if (typeof Html5Qrcode === "undefined") {
        setStatus("Library pemindai QR gagal dimuat. Periksa koneksi internet.");
        return;
      }

      busy = true;
      startBtn.disabled = true;
      setStatus("Meminta izin kamera...");

      try {
        if (!scanner) {
          scanner = new Html5Qrcode("reader");
        }

        const cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
          throw new Error("Kamera tidak ditemukan.");
        }

        const backCamera = cameras.find(camera =>
          /back|rear|environment|belakang/i.test(camera.label)
        );

        const cameraId = (backCamera || cameras[0]).id;

        await scanner.start(
          cameraId,
          {
            fps: 10,
            qrbox: { width: 220, height: 220 }
          },
          onQrScanned,
          function () {}
        );

        running = true;
        setStatus("Kamera aktif. Arahkan ke QR Code siswa.");
      } catch (error) {
        console.error("Camera error:", error);

        if (error.name === "NotAllowedError") {
          setStatus("Izin kamera ditolak. Izinkan kamera di pengaturan browser.");
        } else if (error.name === "NotFoundError") {
          setStatus("Kamera tidak ditemukan di perangkat ini.");
        } else if (error.name === "NotReadableError") {
          setStatus("Kamera sedang digunakan aplikasi lain.");
        } else {
          setStatus("Kamera gagal dibuka: " + error.message);
        }
      } finally {
        busy = false;
        startBtn.disabled = false;
      }
    }

    function onQrScanned(decodedText) {
      const now = Date.now();

      if (decodedText === lastCode &&
          now - lastScanTime < 3000) {
        return;
      }

      lastCode = decodedText;
      lastScanTime = now;

      const nama = document.getElementById("nama").value.trim();

      qrOutput.textContent = decodedText;
      timeOutput.textContent =
        "Waktu scan: " + new Date().toLocaleString("id-ID");

      resultBox.style.display = "block";

      setStatus(
        "QR berhasil dibaca." +
        (nama ? " Nama yang dimasukkan: " + nama : "")
      );

      // Saat ini hanya membaca QR.
      // Belum menyimpan absensi ke Google Sheets.
      console.log("QR terbaca:", decodedText);
    }

    async function closeCamera() {
      if (!scanner || !running) {
        setStatus("Kamera belum aktif.");
        return;
      }

      stopBtn.disabled = true;

      try {
        await scanner.stop();
        running = false;
        setStatus("Kamera berhasil ditutup.");
      } catch (error) {
        console.error(error);
        setStatus("Kamera gagal ditutup. Silakan muat ulang halaman.");
      } finally {
        stopBtn.disabled = false;
      }
    }

    startBtn.addEventListener("click", openCamera);
    stopBtn.addEventListener("click", closeCamera);

    window.addEventListener("pagehide", function() {
      if (scanner && running) {
        scanner.stop().catch(console.error);
      }
    });
  </script>
</body>
</html>
