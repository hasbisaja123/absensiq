```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Aplikasi Absensi QR Sekolah">

  <title>Absensi QR Sekolah</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #111111;
      color: #ffffff;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER HITAM */
    .header {
      flex: 0 0 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 20px;
      background: #111111;
      border-bottom: 1px solid #444444;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #ffffff;
      border-radius: 6px;
      font-size: 12px;
    }

    .header-label {
      padding: 7px 10px;
      border: 1px solid #555555;
      border-radius: 20px;
      color: #dddddd;
      font-size: 10px;
      white-space: nowrap;
    }

    /* AREA APLIKASI */
    .content {
      flex: 1;
      min-height: 0;
      background: #ffffff;
    }

    #appFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    /* PESAN KALAU URL BELUM DIISI */
    .message {
      display: none;
      height: 100%;
      padding: 30px 20px;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #ffffff;
      color: #111111;
    }

    .message h2 {
      margin-top: 0;
      font-size: 21px;
    }

    .message p {
      font-size: 14px;
      line-height: 1.7;
    }

    .retry-button {
      display: inline-block;
      padding: 12px 20px;
      margin-top: 10px;
      background: #111111;
      color: #ffffff;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }

    /* TAMPILAN HP */
    @media (max-width: 600px) {
      .header {
        flex-basis: 54px;
        padding: 0 12px;
      }

      .brand {
        gap: 8px;
        font-size: 12px;
        letter-spacing: 0.5px;
      }

      .brand-icon {
        width: 30px;
        height: 30px;
      }

      .header-label {
        padding: 6px 8px;
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="brand">
      <div class="brand-icon">QR</div>
      <span>ABSENSI SEKOLAH</span>
    </div>

    <div class="header-label">SISTEM ABSENSI</div>
  </header>

  <main class="content">
    <iframe
      id="appFrame"
      title="Aplikasi Absensi QR Sekolah"
      allow="camera; fullscreen"
      allowfullscreen>
    </iframe>

    <section id="errorMessage" class="message">
      <div>
        <h2>Aplikasi Absensi QR</h2>
        <p id="errorText">
          Aplikasi belum dapat ditampilkan.
        </p>
        <a
          class="retry-button"
          id="openApp"
          href="#"
          target="_blank"
          rel="noopener">
          Buka Aplikasi Langsung
        </a>
      </div>
    </section>
  </main>

  <script>
    // URL WEB APP APPS SCRIPT LAMA
    const APP_URL =
      "https://script.google.com/macros/s/AKfycbz-15T7wxQPZKsSE8PpOUBRVl0V7FHZddBCiCDId3ENjinwJYvpuen2eZhM59Hi54aa1g/exec";

    const frame = document.getElementById("appFrame");
    const errorMessage = document.getElementById("errorMessage");
    const errorText = document.getElementById("errorText");
    const openApp = document.getElementById("openApp");

    openApp.href = APP_URL;

    // Tampilkan aplikasi Apps Script
    frame.src = APP_URL;

    // Pesan ini hanya memberi tahu jika iframe gagal dimuat.
    // Browser tidak mengizinkan halaman ini membaca semua error
    // yang terjadi di dalam iframe lintas domain.
    frame.addEventListener("error", function () {
      frame.style.display = "none";
      errorMessage.style.display = "flex";
      errorText.textContent =
        "Aplikasi gagal dimuat. Coba buka aplikasi secara langsung.";
    });
  </script>

  <noscript>
    <p style="padding:20px;color:white;text-align:center">
      Aktifkan JavaScript pada browser untuk menggunakan aplikasi.
    </p>
  </noscript>

</body>
</html>
```
